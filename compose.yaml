services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: gridlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.compose}
      POSTGRES_DB: gridlens
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridlens -d gridlens"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file: .env.compose
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?set COMPOSE_DATABASE_URL in .env.compose}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file: .env.compose
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?set COMPOSE_DATABASE_URL in .env.compose}
      SAVED_BROWSE_ENABLED: ${SAVED_BROWSE_ENABLED:-false}
    command: ["uv", "run", "uvicorn", "gridlens.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  browse:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file: .env.compose
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?set COMPOSE_DATABASE_URL in .env.compose}
      TYPESAFE_API_KEY: ""
      OPENAI_API_KEY: ""
      FIRECRAWL_API_KEY: ""
      WORKER_AUTO_REFRESH: "false"
      AUTONOMOUS_RESEARCH_ENABLED: "false"
      BRIEFS_DAILY_REQUEST_LIMIT: "0"
      PURSUITS_DAILY_FETCH_LIMIT: "0"
      PURSUITS_DAILY_MODEL_LIMIT: "0"
      JEV_SHADOW_DAILY_LIMIT: "0"
    command: ["uv", "run", "python", "-m", "gridlens.jobs.browse", "maintain"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file: .env.compose
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?set COMPOSE_DATABASE_URL in .env.compose}
    command: ["uv", "run", "python", "-m", "gridlens.jobs.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
