name: PR87 publication diagnostic
on:
  push:
    branches:
      - fix/pr87-call-preparation
    paths:
      - .github/workflows/publication-diagnostic.yml
      - scripts/diagnose_publication.py

permissions:
  contents: read

jobs:
  original-ci-order:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PGHOST: 127.0.0.1
      TRUSTED_ORIGINS: http://127.0.0.1:5173
      COOKIE_SECURE: "false"
      OPENAI_API_KEY: ""
      TYPESAFE_API_KEY: ""
      FIRECRAWL_API_KEY: ""
      BRIEFS_DAILY_REQUEST_LIMIT: "0"
      PURSUITS_DAILY_MODEL_LIMIT: "0"
      DIAGNOSTIC_FAILURE_LOG: ${{ github.workspace }}/publication-diagnostic-failures.jsonl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out immutable original PR87 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: 07d676b57df4b02d85257a1f6c10aa5f33db4e5d
          path: original
          persist-credentials: false
      - name: Start disposable PostgreSQL 18.6
        run: |
          set -euo pipefail
          postgres_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${postgres_password}"
          echo "::add-mask::${session_secret}"
          {
            echo "POSTGRES_PASSWORD=${postgres_password}"
            echo "DATABASE_URL=postgresql+psycopg://gridlens:${postgres_password}@127.0.0.1:5432/gridlens"
            echo "TEST_DATABASE_URL=postgresql+psycopg://gridlens:${postgres_password}@127.0.0.1:5432/gridlens_test"
            echo "SESSION_SECRET=${session_secret}"
          } >> "$GITHUB_ENV"
          docker run -d --name pr87-publication-postgres \
            -e POSTGRES_USER=gridlens \
            -e POSTGRES_PASSWORD="${postgres_password}" \
            -e POSTGRES_DB=gridlens \
            -p 127.0.0.1:5432:5432 \
            postgres:18.6
          ready=0
          for _ in $(seq 1 40); do
            if docker exec pr87-publication-postgres pg_isready -U gridlens -d gridlens >/dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "Disposable PostgreSQL did not become ready" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: original/backend/uv.lock
      - name: Install original locked dev dependencies
        run: uv sync --locked --extra dev
        working-directory: original/backend
      - name: Verify immutable original checkout before tests
        run: |
          set -euo pipefail
          test "$(git -C original rev-parse HEAD)" = 07d676b57df4b02d85257a1f6c10aa5f33db4e5d
          git -C original diff --exit-code
          git -C original diff --cached --exit-code
      - name: Migrate disposable application database and create test database
        run: |
          set -euo pipefail
          app_password="$(openssl rand -base64 24)"
          echo "::add-mask::${app_password}"
          password_hash="$(APP_PASSWORD="${app_password}" uv run python -c 'import os, bcrypt; print(bcrypt.hashpw(os.environ["APP_PASSWORD"].encode(), bcrypt.gensalt()).decode())')"
          echo "::add-mask::${password_hash}"
          echo "APP_PASSWORD_HASH=${password_hash}" >> "$GITHUB_ENV"
          export APP_PASSWORD_HASH="${password_hash}"
          uv run alembic upgrade head
          docker exec pr87-publication-postgres psql -U gridlens -d gridlens -c 'CREATE DATABASE gridlens_test'
        working-directory: original/backend
      - name: Run original 360-test prefix and 20 iterations of four publication cases
        run: |
          set -euo pipefail
          uv run python ../../scripts/diagnose_publication.py --repeat-count 20 2>&1 \
            | tail -c 1048576 > "$GITHUB_WORKSPACE/publication-diagnostic.log"
        working-directory: original/backend
      - name: Verify immutable original checkout after tests
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C original rev-parse HEAD)" = 07d676b57df4b02d85257a1f6c10aa5f33db4e5d
          git -C original diff --exit-code
          git -C original diff --cached --exit-code
      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr87-original-publication-diagnostic
          path: |
            ${{ github.workspace }}/publication-diagnostic.log
            ${{ github.workspace }}/publication-diagnostic-failures.jsonl
          retention-days: 7
          if-no-files-found: ignore
