name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TRUSTED_ORIGINS: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      # Ephemeral CI only. The database password, session secret, and password
      # hash are created on the runner and are not deployed credentials.
      - name: Start ephemeral Postgres
        run: |
          set -euo pipefail
          postgres_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          if [ -z "${postgres_password}" ] || [ -z "${session_secret}" ]; then
            echo "Runtime CI secret generation failed" >&2
            exit 1
          fi
          echo "::add-mask::${postgres_password}"
          echo "::add-mask::${session_secret}"
          export POSTGRES_PASSWORD="${postgres_password}"
          {
            echo "POSTGRES_PASSWORD<<EOF"
            echo "${postgres_password}"
            echo "EOF"
            echo "DATABASE_URL<<EOF"
            echo "postgresql+psycopg://gridlens:${postgres_password}@127.0.0.1:5432/gridlens"
            echo "EOF"
            echo "TEST_DATABASE_URL<<EOF"
            echo "postgresql+psycopg://gridlens:${postgres_password}@127.0.0.1:5432/gridlens_test"
            echo "EOF"
            echo "SESSION_SECRET<<EOF"
            echo "${session_secret}"
            echo "EOF"
          } >> "$GITHUB_ENV"
          docker run -d --name gridlens-ci-postgres \
            -e POSTGRES_USER=gridlens \
            -e POSTGRES_PASSWORD \
            -e POSTGRES_DB=gridlens \
            -p 127.0.0.1:5432:5432 \
            postgres:18.6
          ready=0
          for _ in $(seq 1 40); do
            if docker exec gridlens-ci-postgres pg_isready -U gridlens -d gridlens; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "Postgres did not become ready" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
        working-directory: backend
      - name: Generate ephemeral app password hash
        working-directory: backend
        run: |
          set -euo pipefail
          app_password="$(openssl rand -base64 24)"
          echo "::add-mask::${app_password}"
          password_hash="$(
            APP_PASSWORD="${app_password}" uv run python -c 'import os, bcrypt, sys; password = os.environ["APP_PASSWORD"].encode(); hashed = bcrypt.hashpw(password, bcrypt.gensalt()); sys.exit("generated hash did not verify") if not bcrypt.checkpw(password, hashed) else sys.stdout.write(hashed.decode())'
          )"
          echo "::add-mask::${password_hash}"
          if [ -z "${password_hash}" ]; then
            echo "Runtime password hash was empty" >&2
            exit 1
          fi
          {
            echo "APP_PASSWORD_HASH<<EOF"
            echo "${password_hash}"
            echo "EOF"
          } >> "$GITHUB_ENV"
      - run: uv run ruff check src tests
        working-directory: backend
      - run: uv run mypy src
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run alembic check
        working-directory: backend
      - name: Create test database
        run: docker exec gridlens-ci-postgres psql -U gridlens -d gridlens -c 'CREATE DATABASE gridlens_test'
      - run: uv run pytest tests
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm audit --prefix web --audit-level=high
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
