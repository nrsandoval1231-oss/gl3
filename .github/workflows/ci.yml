name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on PR branches; never cancel main-branch runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      brand: ${{ steps.filter.outputs.brand }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        run: |
          set -euo pipefail
          # Full suite always runs for PRs (pre-merge gate) and main pushes.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            { echo "full=true"; echo "backend=true"; echo "web=true"; echo "brand=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${GITHUB_EVENT_BEFORE}"
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            # Branch creation or unavailable base: run everything.
            { echo "full=true"; echo "backend=true"; echo "web=true"; echo "brand=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "${base}" || true
          files="$(git diff --name-only "${base}" HEAD)"
          if [ -z "${files}" ]; then
            files="$(git diff --name-only "${base}" HEAD~0 || true)"
          fi
          has() { printf '%s\n' "${files}" | grep -q "$1"; }
          backend=false; web=false; brand=false; full=false
          if has '^uv\.lock$' || has '^package-lock\.json$' || has '^\.github/workflows/' || has '^config/' || has '^backend/migrations/'; then
            full=true
          fi
          if has '^backend/'; then backend=true; fi
          if has '^web/'; then web=true; brand=true; fi
          if has '^tools/brand/'; then brand=true; fi
          if ! has '^backend/\|^web/\|^tools/brand/'; then
            # Unmatched paths (docs, scripts, root files): safest default is the full suite.
            full=true
          fi
          if [ "${full}" = "true" ]; then backend=true; web=true; brand=true; fi
          { echo "full=${full}"; echo "backend=${backend}"; echo "web=${web}"; echo "brand=${brand}"; } >> "$GITHUB_OUTPUT"
          echo "changed paths classified: backend=${backend} web=${web} brand=${brand} full=${full}"

  backend:
    if: needs.changes.outputs.backend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRUSTED_ORIGINS: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Ephemeral CI only. The database password, session secret, and password
      # hash are created on the runner and are not deployed credentials.
      - name: Start ephemeral Postgres
        run: |
          set -euo pipefail
          postgres_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          if [ -z "${postgres_password}" ] || [ -z "${session_secret}" ]; then
            echo "Runtime CI secret generation failed" >&2
            exit 1
          fi
          echo "::add-mask::${postgres_password}"
          echo "::add-mask::${session_secret}"
          export POSTGRES_PASSWORD="${postgres_password}"
          {
            echo "POSTGRES_PASSWORD<<EOF"
            echo "${postgres_password}"
            echo "EOF"
            echo "DATABASE_URL<<EOF"
            echo "postgresql+psycopg://gridlens:${postgres_password}@127.0.0.1:5432/gridlens"
            echo "EOF"
            echo "TEST_DATABASE_URL<<EOF"
            echo "postgresql+psycopg://gridlens:${postgres_password}@127.0.0.1:5432/gridlens_test"
            echo "EOF"
            echo "SESSION_SECRET<<EOF"
            echo "${session_secret}"
            echo "EOF"
          } >> "$GITHUB_ENV"
          docker run -d --name gridlens-ci-postgres \
            -e POSTGRES_USER=gridlens \
            -e POSTGRES_PASSWORD \
            -e POSTGRES_DB=gridlens \
            -p 127.0.0.1:5432:5432 \
            postgres:18.6
          ready=0
          for _ in $(seq 1 40); do
            if docker exec gridlens-ci-postgres pg_isready -U gridlens -d gridlens; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "Postgres did not become ready" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
        working-directory: backend
      - name: Export locked backend dependencies
        run: |
          mkdir -p .artifacts
          uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file .artifacts/backend-requirements.txt
        working-directory: backend
      - name: Audit locked backend dependencies
        run: uv tool run --python 3.11 --from pip-audit==2.10.1 pip-audit -r .artifacts/backend-requirements.txt --disable-pip --no-deps --format json > .artifacts/backend-dependency-audit.json
        working-directory: backend
      - name: Audit brand tool dependencies
        run: |
          mkdir -p .artifacts
          uv tool run --python 3.11 --from pip-audit==2.10.1 pip-audit -r tools/brand/requirements.txt --format json > .artifacts/brand-dependency-audit.json
      - name: Retain brand dependency audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brand-dependency-audit
          path: .artifacts/brand-dependency-audit.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain backend dependency audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-dependency-audit
          path: backend/.artifacts/backend-dependency-audit.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Generate ephemeral app password hash
        working-directory: backend
        run: |
          set -euo pipefail
          app_password="$(openssl rand -base64 24)"
          echo "::add-mask::${app_password}"
          password_hash="$(
            APP_PASSWORD="${app_password}" uv run python -c 'import os, bcrypt, sys; password = os.environ["APP_PASSWORD"].encode(); hashed = bcrypt.hashpw(password, bcrypt.gensalt()); sys.exit("generated hash did not verify") if not bcrypt.checkpw(password, hashed) else sys.stdout.write(hashed.decode())'
          )"
          echo "::add-mask::${password_hash}"
          if [ -z "${password_hash}" ]; then
            echo "Runtime password hash was empty" >&2
            exit 1
          fi
          {
            echo "APP_PASSWORD_HASH<<EOF"
            echo "${password_hash}"
            echo "EOF"
            echo "GRIDLENS_TEST_PASSWORD<<EOF"
            echo "${app_password}"
            echo "EOF"
          } >> "$GITHUB_ENV"
      - run: uv run ruff check src tests
        working-directory: backend
      - run: uv run ruff format --check src tests
        working-directory: backend
      - run: uv run mypy src
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run alembic check
        working-directory: backend
      - name: Create test database
        run: docker exec gridlens-ci-postgres psql -U gridlens -d gridlens -c 'CREATE DATABASE gridlens_test'
      - name: Run backend test suite
        # Regression gate: 12m until xdist proves out; the -n 4 target is well under 8m.
        run: timeout 720 uv run pytest tests -n 4
        working-directory: backend
  browser:
    if: needs.changes.outputs.backend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRUSTED_ORIGINS: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Ephemeral CI only. The database password, session secret, and password
      # hash are created on the runner and are not deployed credentials.
      - name: Start ephemeral Postgres
        run: |
          set -euo pipefail
          postgres_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          if [ -z "${postgres_password}" ] || [ -z "${session_secret}" ]; then
            echo "Runtime CI secret generation failed" >&2
            exit 1
          fi
          echo "::add-mask::${postgres_password}"
          echo "::add-mask::${session_secret}"
          export POSTGRES_PASSWORD="${postgres_password}"
          {
            echo "POSTGRES_PASSWORD<<EOF"
            echo "${postgres_password}"
            echo "EOF"
            echo "DATABASE_URL<<EOF"
            echo "postgresql+psycopg://gridlens:${postgres_password}@127.0.0.1:5432/gridlens"
            echo "EOF"
            echo "SESSION_SECRET<<EOF"
            echo "${session_secret}"
            echo "EOF"
          } >> "$GITHUB_ENV"
          docker run -d --name gridlens-ci-postgres             -e POSTGRES_USER=gridlens             -e POSTGRES_PASSWORD             -e POSTGRES_DB=gridlens             -p 127.0.0.1:5432:5432             postgres:18.6
          ready=0
          for _ in $(seq 1 40); do
            if docker exec gridlens-ci-postgres pg_isready -U gridlens -d gridlens; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "Postgres did not become ready" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
        working-directory: backend
      - name: Generate ephemeral app password hash
        working-directory: backend
        run: |
          set -euo pipefail
          app_password="$(openssl rand -base64 24)"
          echo "::add-mask::${app_password}"
          password_hash="$(
            APP_PASSWORD="${app_password}" uv run python -c 'import os, bcrypt, sys; password = os.environ["APP_PASSWORD"].encode(); hashed = bcrypt.hashpw(password, bcrypt.gensalt()); sys.exit("generated hash did not verify") if not bcrypt.checkpw(password, hashed) else sys.stdout.write(hashed.decode())'
          )"
          echo "::add-mask::${password_hash}"
          if [ -z "${password_hash}" ]; then
            echo "Runtime password hash was empty" >&2
            exit 1
          fi
          {
            echo "APP_PASSWORD_HASH<<EOF"
            echo "${password_hash}"
            echo "EOF"
            echo "GRIDLENS_TEST_PASSWORD<<EOF"
            echo "${app_password}"
            echo "EOF"
          } >> "$GITHUB_ENV"
      - run: uv run alembic upgrade head
        working-directory: backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Install Chromium and system dependencies
        run: |
          set -euo pipefail
          mirror_list=/etc/apt/apt-mirrors.txt
          test "$(grep -oE 'http://azure\.archive\.ubuntu\.com/ubuntu(/|[[:space:]]|$)' "$mirror_list" | wc -l)" -eq 1
          sudo sed -i -E 's#http://azure\.archive\.ubuntu\.com/ubuntu(/|[[:space:]]|$)#https://archive.ubuntu.com/ubuntu\1#' "$mirror_list"
          grep -Eq 'https://archive\.ubuntu\.com/ubuntu(/|[[:space:]]|$)' "$mirror_list"
          npx playwright install --with-deps chromium
        working-directory: web
      # Reuse only this runner's migrated, disposable application database.
      # No ingestion worker or live-source acceptance tests run in PR CI.
      - name: Browser regressions and real authentication
        run: npm run test:ci --prefix web
        env:
          COOKIE_SECURE: "false"
          WORKER_AUTO_REFRESH: "false"
          OPENAI_API_KEY: ""
          TYPESAFE_API_KEY: ""
          BRIEFS_DAILY_REQUEST_LIMIT: "0"
          PURSUITS_DAILY_MODEL_LIMIT: "0"
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failure-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore


  web:
    if: needs.changes.outputs.web == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm audit --prefix web --audit-level=high
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web

  brand-assets:
    if: needs.changes.outputs.brand == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: "3.11"
      - run: uv venv .venv-brand
      - run: uv pip install --python .venv-brand/bin/python -r tools/brand/requirements.txt
      - name: Validate brand sources, outputs, references and contrast
        run: .venv-brand/bin/python tools/brand/validate.py
      # Passing structural checks is not owner visual acceptance. The manifest
      # records review-candidate until the exact geometry and wordmark are approved.
