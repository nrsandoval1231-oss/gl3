# Authenticated API responses must never be stored by shared caches or the
# browser. The map yields an empty value (header omitted) for non-API paths so
# the header can live at server scope and be inherited by every location.
map $uri $gridlens_api_cache_control {
  default "";
  ~^/api/ "private, no-store";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # All security headers are declared once at server scope: any add_header inside
  # a location would silently discard these inherited ones (see
  # backend/tests/unit/test_deployment_security.py). The built app has no inline
  # scripts or styles, loads fonts from /fonts and icons from 'self'; React sets
  # style via the CSSOM, which style-src does not block.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $gridlens_api_cache_control always;
  # HSTS is intentionally omitted here: TLS terminates at Cloudflare, so this
  # origin only sees plain HTTP. Enable HSTS in the Cloudflare zone instead.
  # Compress text responses; the API returns large JSON pages.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/javascript text/css image/svg+xml text/plain;
  # Vite fingerprints everything under /assets/, so it can be cached for a year.
  # `expires` is used instead of add_header so the framing headers stay inherited.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location = /index.html {
    expires -1;
  }
  location /api/ {
    proxy_pass http://api:8000/api/;
    # The server-scope Cache-Control is authoritative for API responses.
    proxy_hide_header Cache-Control;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /openapi.json {
    proxy_pass http://api:8000/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
