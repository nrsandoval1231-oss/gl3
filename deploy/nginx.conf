server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # The standalone application is not embedded by another site.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  # Compress text responses; the API returns large JSON pages.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/javascript text/css image/svg+xml text/plain;
  # Vite fingerprints everything under /assets/, so it can be cached for a year.
  # `expires` is used instead of add_header so the framing headers stay inherited.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location = /index.html {
    expires -1;
  }
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /openapi.json {
    proxy_pass http://api:8000/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
