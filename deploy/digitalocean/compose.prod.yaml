# Production stack for one DigitalOcean droplet.
# Database: DigitalOcean Managed PostgreSQL (DATABASE_URL in .env.prod, sslmode=require).
# Ingress: Cloudflare Tunnel only. No ports are published on the droplet.
# Run from the repository root:
#   docker compose -f deploy/digitalocean/compose.prod.yaml --env-file .env.prod up -d --build
name: gridlens

x-backend: &backend
  build:
    context: ../..
    dockerfile: deploy/Dockerfile.backend
  env_file: ../../.env.prod
  # Compose does not forward host environment values into env_file containers.
  # infisical run injects the existing keys into these variables without writing a key file.
  # Backend containers only; never the web image.
  environment:
    TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    SAVED_BROWSE_ENABLED: ${SAVED_BROWSE_ENABLED:-false}
    BROWSE_SERVE_STALE: ${BROWSE_SERVE_STALE:-false}
    OPERATIONAL_RECEIPT_FILE: ${OPERATIONAL_RECEIPT_FILE:-}
    # Only the nginx `web` container (inside this fixed subnet) may supply
    # X-Forwarded-For; see the `networks` block below. Must match that subnet.
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.28.0.0/24}
  # The Python services need no Linux capabilities or privilege escalation.
  # read_only is not set: uv, tempfile-based document adapters and the pip/uv
  # caches write to the container filesystem, so it needs separate validation.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  migrate:
    <<: *backend
    command: ["uv", "run", "alembic", "upgrade", "head"]
    # Migrations never call providers; blank keys like the browse service.
    environment:
      TYPESAFE_API_KEY: ""
      OPENAI_API_KEY: ""
      FIRECRAWL_API_KEY: ""
    restart: "no"

  api:
    <<: *backend
    # Handlers are synchronous; extra processes keep one slow read from stalling the rest.
    # Each process holds its own database pool (up to 15 connections).
    command: ["uv", "run", "uvicorn", "gridlens.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers", "--workers", "${API_WORKERS:-2}"]
    volumes:
      - ${OPERATIONAL_RECEIPT_HOST_FILE:-/dev/null}:/run/gridlens/operational-receipt.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["uv", "run", "python", "-m", "gridlens.jobs.worker"]
    volumes:
      - ${OPERATIONAL_RECEIPT_HOST_FILE:-/dev/null}:/run/gridlens/operational-receipt.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  browse:
    <<: *backend
    command: ["uv", "run", "python", "-m", "gridlens.jobs.browse", "maintain"]
    environment:
      TYPESAFE_API_KEY: ""
      OPENAI_API_KEY: ""
      FIRECRAWL_API_KEY: ""
      WORKER_AUTO_REFRESH: "false"
      AUTONOMOUS_RESEARCH_ENABLED: "false"
      BRIEFS_DAILY_REQUEST_LIMIT: "0"
      PURSUITS_DAILY_FETCH_LIMIT: "0"
      PURSUITS_DAILY_MODEL_LIMIT: "0"
      JEV_SHADOW_DAILY_LIMIT: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      - api
    # cap_drop is not applied: the stock nginx image starts as root and needs
    # CHOWN/SETUID/SETGID to drop to its worker user.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env.prod}
    depends_on:
      - web
    restart: unless-stopped

# Fixed subnet so the API can trust X-Forwarded-For only from the nginx `web`
# container (TRUSTED_PROXY_CIDRS). Without it every user shares one login-lockout
# bucket keyed on the proxy address. Change both together if it collides.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
